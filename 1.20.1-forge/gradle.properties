# Gradle JVM settings - 3G heap; daemon + build cache + parallel on for faster rebuilds (run `gradlew --stop` to free the daemon's memory)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true


## Environment Properties
# Which Minecraft/Forge/mappings we build against.
# NOTE: .properties files do NOT support trailing comments - keep comments
# on their own line or they become part of the value.

minecraft_version=1.20.1
# mods.toml: this mod works on 1.20.1 only
minecraft_version_range=[1.20.1,1.21)

forge_version=47.4.0
# mods.toml Forge dependency: the FMLJavaModLoadingContext constructor parameter needs 47.3.10+; matches README (47.4.0+)
forge_version_range=[47.4.0,)
loader_version_range=[47,)

mapping_channel=parchment
mapping_version=2023.08.20-1.20.1


## Mod Properties
mod_id=tacz_betterexplosion
mod_name=[TaCZ] Better Explosion
mod_license=MIT
mod_version=0.3.1
mod_group_id=com.poseidon.tacz_betterexplosion
mod_authors=Poseidon
mod_description=Improves explosions caused by TaCZ guns and projectiles.
